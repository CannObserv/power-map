{# admin/role_assignments/partials/_dates_read.html — service dates read partial #}
<div id="dates-field" style="margin-top:var(--space-5)">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)">
    <h3 class="field-group-label">Service Dates</h3>
    {% if not ra.archived_at %}
    <button type="button" class="btn btn--sm btn--secondary"
            hx-get="/admin/role-assignments/{{ ra.id }}/inline/dates/edit/"
            hx-target="#dates-field"
            hx-swap="outerHTML">Edit</button>
    {% endif %}
  </div>
  <div style="display:flex;gap:var(--space-6);font-size:var(--font-size-sm)">
    <div>
      <div class="field-group-label" style="font-size:var(--font-size-xs)">Start</div>
      <div style="color:{% if ra.start_date %}var(--color-text){% else %}var(--color-text-muted){% endif %}">
        {{ ra.start_date or '—' }}
      </div>
    </div>
    <div>
      <div class="field-group-label" style="font-size:var(--font-size-xs)">End</div>
      <div style="color:{% if ra.end_date %}var(--color-text){% else %}var(--color-text-muted){% endif %}">
        {{ ra.end_date or '—' }}
      </div>
    </div>
  </div>
</div>
