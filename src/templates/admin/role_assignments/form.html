{% extends "admin/base.html" %}
{% block title %}New Role Assignment{% endblock %}
{% block breadcrumb %}
  <a href="/admin/">Dashboard</a><span class="breadcrumb__sep">›</span>
  <a href="/admin/role-assignments/">Role Assignments</a><span class="breadcrumb__sep">›</span>
  <span>New</span>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New Role Assignment</h1>
</div>
<div class="entity-card">
  {% if error %}
  <div class="alert alert--error" role="alert">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/admin/role-assignments/new/">
    <div class="form-group">
      <label for="person_id">Person <span aria-hidden="true">*</span></label>
      <select id="person_id" name="person_id" required>
        <option value="">— select person —</option>
        {% for person in people %}
        <option value="{{ person.id }}"
          {% if form_person_id is defined and form_person_id == person.id %}selected{% endif %}>
          {{ person.name or person.id }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="role_id">Role <span aria-hidden="true">*</span></label>
      <select id="role_id" name="role_id" required>
        <option value="">— select role —</option>
        {% for role in roles %}
        <option value="{{ role.id }}"
          {% if form_role_id is defined and form_role_id == role.id %}selected{% endif %}>
          {{ role.title }} ({{ role.org_name or '(unnamed)' }})
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="is_current" name="is_current" value="true"
               onchange="document.getElementById('end_date').disabled = this.checked"
               {% if form_is_current is defined and form_is_current %}checked{% endif %}>
        Current assignment
      </label>
    </div>
    <div class="form-group">
      <label for="start_date">Start date</label>
      <input id="start_date" name="start_date" type="date"
             value="{{ form_start_date if form_start_date is defined else '' }}">
    </div>
    <div class="form-group">
      <label for="end_date">End date</label>
      <input id="end_date" name="end_date" type="date"
             value="{{ form_end_date if form_end_date is defined else '' }}"
             {% if form_is_current is defined and form_is_current %}disabled{% endif %}>
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="3">{{ form_notes if form_notes is defined else '' }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn--primary">Create assignment</button>
      <a href="/admin/role-assignments/" class="btn btn--ghost">Cancel</a>
    </div>
  </form>
</div>
<script>
  // Ensure end_date disabled state is correct on page load
  (function() {
    var cb = document.getElementById('is_current');
    var ed = document.getElementById('end_date');
    if (cb && ed) { ed.disabled = cb.checked; }
  })();
</script>
{% endblock %}
