{% extends "admin/base.html" %}
{% block title %}Role Assignments{% endblock %}
{% block breadcrumb %}
  <a href="/admin/">Dashboard</a><span class="breadcrumb__sep">›</span><span>Role Assignments</span>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Role Assignments</h1>
  <a href="/admin/role-assignments/new/" class="btn btn--primary">+ Add assignment</a>
</div>
<div class="filter-card">
  <input type="search" name="q" value="{{ q }}" placeholder="Search by person, role, or org…"
         aria-label="Search assignments" class="filter-card__search"
         hx-get="/admin/role-assignments/" hx-trigger="input delay:300ms, search"
         hx-target="#ra-list-region" hx-include="[name='status'],[name='page_size']" hx-push-url="true">
  <div class="filter-card__controls">
    <div class="filter-card__field">
      <label for="ra-status-filter">Status</label>
      <select id="ra-status-filter" name="status"
              hx-get="/admin/role-assignments/" hx-trigger="change"
              hx-target="#ra-list-region" hx-include="[name='q'],[name='page_size']" hx-push-url="true">
        <option value="active"   {% if status=='active'   %}selected{% endif %}>Active</option>
        <option value="archived" {% if status=='archived' %}selected{% endif %}>Archived</option>
      </select>
    </div>
    <div class="filter-card__field">
      <label for="ra-page-size">Per page</label>
      <select id="ra-page-size" name="page_size"
              hx-get="/admin/role-assignments/" hx-trigger="change"
              hx-target="#ra-list-region"
              hx-include="[name='q'],[name='status']"
              hx-vals='{"page": 1}'
              hx-push-url="true">
        <option value="25"  {% if page_size==25  %}selected{% endif %}>25</option>
        <option value="50"  {% if page_size==50  %}selected{% endif %}>50</option>
        <option value="100" {% if page_size==100 %}selected{% endif %}>100</option>
        <option value="250" {% if page_size==250 %}selected{% endif %}>250</option>
      </select>
    </div>
  </div>
</div>
<div id="ra-list-region">
  {% include "admin/role_assignments/_region.html" %}
</div>
{% endblock %}
