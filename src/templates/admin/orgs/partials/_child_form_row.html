{# admin/orgs/partials/_child_form_row.html — multi-instance form row.
   row_key contract: docs/UI.md § Multi-instance form-row partials: row-key contract #}
{%- set row_key = row_key | default('new') -%}
<tr id="child-row-{{ row_key }}">
  <td colspan="3" style="padding:var(--space-2) var(--space-4)">
    <form hx-post="/admin/orgs/{{ org_id }}/children/"
          hx-target="#child-row-{{ row_key }}"
          hx-swap="outerHTML"
          style="display:flex;gap:var(--space-2);align-items:center">
      <div class="form-group" style="margin-bottom:0;flex:1;position:relative">
        <input type="text" autocomplete="off" placeholder="Search for an organization…"
               id="child-search-display-{{ row_key }}"
               aria-label="Search for an organization"
               hx-get="/admin/orgs/{{ org_id }}/children/search/"
               hx-trigger="input changed delay:200ms"
               hx-target="#child-search-results-{{ row_key }}"
               hx-swap="innerHTML"
               hx-params="q"
               name="q"
               role="combobox"
               aria-expanded="false"
               aria-haspopup="listbox"
               aria-controls="child-search-results-{{ row_key }}"
               aria-autocomplete="list">
        <input type="hidden" name="child_id" id="child-id-hidden-{{ row_key }}">
        <ul id="child-search-results-{{ row_key }}" class="typeahead-results" role="listbox"></ul>
      </div>
      <div style="display:flex;gap:var(--space-2);white-space:nowrap">
        <button type="submit" class="btn btn--sm btn--primary">Add</button>
        <button type="button" class="btn btn--sm btn--secondary"
                onclick="this.closest('tr').remove(); document.dispatchEvent(new CustomEvent('powerMap:newRowClosed'));">Cancel</button>
      </div>
    </form>
    <script>
    window.initTypeaheadCombobox({
      inputId: 'child-search-display-{{ row_key }}',
      listboxId: 'child-search-results-{{ row_key }}',
      hiddenId: 'child-id-hidden-{{ row_key }}',
    });
    </script>
  </td>
</tr>
