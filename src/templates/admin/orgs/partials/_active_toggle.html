{# admin/orgs/partials/_active_toggle.html — auto-saving active toggle #}
<div id="active-toggle" class="form-group" style="display:flex;align-items:center">
  <label class="toggle" style="margin-bottom:0">
    <input type="checkbox"
           name="active"
           value="true"
           aria-label="Mark organization as active"
           {% if org.active %}checked{% endif %}
           {% if org.archived_at %}disabled{% endif %}
           hx-post="/admin/orgs/{{ org.id }}/inline/active/"
           hx-target="#active-toggle"
           hx-swap="outerHTML"
           hx-include="this">
    <span class="toggle__track"><span class="toggle__thumb"></span></span>
    <span class="toggle__label">
      {% if org.archived_at %}<span class="badge badge--archived">Archived</span>
      {% elif not org.active %}<span class="badge badge--inactive">Inactive</span>
      {% else %}<span class="badge badge--active">Active</span>{% endif %}
    </span>
  </label>
  {% if org.archived_at %}
  <button type="button" class="btn btn--secondary btn--sm" style="margin-left:var(--space-5)"
          hx-post="/admin/orgs/{{ org.id }}/unarchive/" hx-swap="none">
    Restore from archive
  </button>
  {% endif %}
</div>
