{# admin/orgs/partials/_acronym_form_row.html — inline acronym edit/new form row #}
<tr id="{% if a %}acronym-row-{{ a.id }}{% else %}acronym-row-new{% endif %}">
  <td colspan="3">
    <form {% if a %}
          hx-post="/admin/orgs/{{ org_id }}/acronyms/{{ a.id }}/edit-row/"
          hx-target="#acronym-row-{{ a.id }}"
          hx-swap="outerHTML"
          {% else %}
          hx-post="/admin/orgs/{{ org_id }}/acronyms/"
          hx-target="#acronyms-table tbody"
          hx-swap="innerHTML"
          {% endif %}
          style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
      <input type="text" name="acronym" required value="{{ a.acronym if a else '' }}" placeholder="Acronym">
      <label><input type="checkbox" name="is_canonical" value="true"
                    {% if a and a.is_canonical %} checked{% endif %}> Canonical</label>
      <button type="submit" class="btn btn--sm btn--primary">Save</button>
      <button type="button" class="btn btn--sm btn--secondary"
              {% if a %}
              hx-get="/admin/orgs/{{ org_id }}/acronyms/{{ a.id }}/read-row/"
              hx-target="#acronym-row-{{ a.id }}"
              hx-swap="outerHTML"
              {% else %}
              onclick="this.closest('tr').remove()"
              {% endif %}>Cancel</button>
    </form>
  </td>
</tr>
