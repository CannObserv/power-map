{# admin/orgs/partials/_acronym_row.html — inline acronym read row #}
<tr id="acronym-row-{{ a.id }}">
  <td>{{ a.acronym }}</td>
  <td style="text-align:right">{% if a.is_canonical %}<span class="badge badge--active">Yes</span>{% else %}—{% endif %}</td>
  <td style="text-align:right;white-space:nowrap">
    <button type="button" class="btn btn--sm btn--secondary"
            hx-get="/admin/orgs/{{ org_id }}/acronyms/{{ a.id }}/edit-row/"
            hx-target="#acronym-row-{{ a.id }}"
            hx-swap="outerHTML">Edit</button>
    <button type="button" class="btn btn--sm btn--danger"
            hx-delete="/admin/orgs/{{ org_id }}/acronyms/{{ a.id }}/"
            hx-target="#acronyms-table tbody"
            hx-swap="innerHTML"
            hx-confirm="Delete this acronym?">Delete</button>
  </td>
</tr>
