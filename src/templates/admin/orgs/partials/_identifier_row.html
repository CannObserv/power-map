{# admin/orgs/partials/_identifier_row.html #}
<tr id="identifier-row-{{ ident.id }}">
  <td title="{{ ident.type_full_name }}">{{ ident.type_name }}</td>
  <td>{{ ident.value }}</td>
  <td style="text-align:right;white-space:nowrap">
    <button type="button" class="btn btn--sm btn--secondary"
            aria-label="Edit {{ ident.type_name }} identifier {{ ident.value }}"
            hx-get="/admin/orgs/{{ org_id }}/identifiers/{{ ident.id }}/edit-row/"
            hx-target="#identifier-row-{{ ident.id }}"
            hx-swap="outerHTML">Edit</button>
    <button type="button" class="btn btn--sm btn--danger"
            aria-label="Delete {{ ident.type_name }} identifier {{ ident.value }}"
            hx-delete="/admin/orgs/{{ org_id }}/identifiers/{{ ident.id }}/"
            hx-target="#identifier-row-{{ ident.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this identifier?">Delete</button>
  </td>
</tr>
