{# admin/orgs/partials/_name_form_row.html — inline name edit/new form row #}
<tr id="{% if n %}name-row-{{ n.id }}{% else %}name-row-new{% endif %}">
  <td colspan="5" style="padding:var(--space-2) var(--space-4)">
    <form {% if n %}
          hx-post="/admin/orgs/{{ org_id }}/names/{{ n.id }}/edit-row/"
          hx-target="#names-table tbody"
          hx-swap="innerHTML"
          {% else %}
          hx-post="/admin/orgs/{{ org_id }}/names/"
          hx-target="#names-table tbody"
          hx-swap="innerHTML"
          {% endif %}
          style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center">
      <div class="form-group" style="margin-bottom:0;flex:1;min-width:8rem">
        <input type="text" name="name" required value="{{ n.name if n else '' }}" placeholder="Name">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <select name="name_type">
          {# `name_types` injected by `make_names_router` — driven by
             `src.core.types.ORG_NAME_TYPES`. #}
          {% for t in name_types %}
          <option value="{{ t }}"{% if n and n.name_type == t %} selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <label class="toggle" style="flex-shrink:0">
        <input type="checkbox" name="is_canonical" value="true" aria-label="Canonical"
               {% if n and n.is_canonical %} checked{% endif %}>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
      </label>
      {# Effective-date timeline (#239). Empty = unknown/ongoing; the form is the
         source of truth on save, so clearing a field nulls the column. #}
      <div class="form-group" style="margin-bottom:0">
        <input type="date" name="effective_start" aria-label="Effective start" title="Effective start"
               value="{{ n.effective_start if n and n.effective_start else '' }}">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <input type="date" name="effective_end" aria-label="Effective end" title="Effective end"
               value="{{ n.effective_end if n and n.effective_end else '' }}">
      </div>
      <div style="display:flex;gap:var(--space-2);margin-left:auto;white-space:nowrap">
        <button type="submit" class="btn btn--sm btn--primary">Save</button>
        <button type="button" class="btn btn--sm btn--secondary"
                {% if n %}
                hx-get="/admin/orgs/{{ org_id }}/names/{{ n.id }}/read-row/"
                hx-target="#name-row-{{ n.id }}"
                hx-swap="outerHTML"
                {% else %}
                onclick="this.closest('tr').remove(); document.dispatchEvent(new CustomEvent('powerMap:newRowClosed'));"
                {% endif %}>Cancel</button>
      </div>
    </form>
  </td>
</tr>
