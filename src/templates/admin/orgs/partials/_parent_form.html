{# admin/orgs/partials/_parent_form.html #}
<tr id="parent-row">
  <td>
    <div class="form-group" style="margin-bottom:0;position:relative">
      <input id="parent-search" type="text" autocomplete="off"
             placeholder="Type to search…"
             value="{{ parent.display_name if parent else '' }}"
             hx-get="/admin/orgs/search/"
             hx-trigger="input changed delay:200ms"
             hx-target="#parent-search-results"
             hx-params="q"
             name="q"
             role="combobox"
             aria-expanded="false"
             aria-haspopup="listbox"
             aria-controls="parent-search-results"
             aria-autocomplete="list">
      <input type="hidden" name="parent_id" id="parent-id-hidden"
             value="{{ parent.id if parent else '' }}">
    </div>
    <ul id="parent-search-results" class="typeahead-results" role="listbox"></ul>
  </td>
  <td style="text-align:right">
    <div class="btn-group" style="margin-left:auto">
      <button type="button" class="btn btn--primary btn--sm"
              hx-post="/admin/orgs/{{ org.id }}/inline/parent/"
              hx-target="#parent-row"
              hx-swap="outerHTML"
              hx-include="#parent-id-hidden">Save</button>
      <button type="button" class="btn btn--secondary btn--sm"
              hx-get="/admin/orgs/{{ org.id }}/inline/parent/"
              hx-target="#parent-row"
              hx-swap="outerHTML">Cancel</button>
      <button type="button" class="btn btn--danger btn--sm"
              hx-post="/admin/orgs/{{ org.id }}/inline/parent/"
              hx-target="#parent-row"
              hx-swap="outerHTML"
              hx-vals='{"parent_id": ""}'
              hx-confirm="Remove parent organization?"
              data-confirm-label="Unlink">Unlink</button>
    </div>
    <script>
    (function() {
      var inp    = document.getElementById('parent-search');
      var ul     = document.getElementById('parent-search-results');
      var hidden = document.getElementById('parent-id-hidden');
      var activeIdx = -1;

      function getItems() { return Array.from(ul.querySelectorAll('li[data-id]')); }

      function setActive(idx) {
        var items = getItems();
        activeIdx = Math.max(-1, Math.min(idx, items.length - 1));
        items.forEach(function(li, i) {
          li.classList.toggle('is-active', i === activeIdx);
          if (i === activeIdx) li.scrollIntoView({ block: 'nearest' });
        });
        inp.setAttribute('aria-activedescendant', activeIdx >= 0 ? (items[activeIdx].id || '') : '');
      }

      function selectItem(li) {
        hidden.value = li.dataset.id;
        inp.value = li.dataset.label;
        closeDropdown();
      }

      function openDropdown() {
        var r = inp.getBoundingClientRect();
        ul.style.top   = r.bottom + 'px';
        ul.style.left  = r.left + 'px';
        ul.style.width = r.width + 'px';
        ul.style.display = 'block';
        activeIdx = -1;
        inp.setAttribute('aria-expanded', 'true');
        document.addEventListener('click', outsideClick);
        document.addEventListener('scroll', onScroll, true);
      }

      function closeDropdown() {
        ul.style.display = 'none';
        ul.innerHTML = '';
        activeIdx = -1;
        inp.setAttribute('aria-expanded', 'false');
        inp.setAttribute('aria-activedescendant', '');
        document.removeEventListener('click', outsideClick);
        document.removeEventListener('scroll', onScroll, true);
      }

      function outsideClick(e) {
        if (!ul.contains(e.target) && e.target !== inp) closeDropdown();
      }

      function onScroll(e) { if (e.target !== ul) closeDropdown(); }

      ul.addEventListener('htmx:afterSwap', function() {
        // Scope opt-* IDs to this listbox to prevent duplicates when both
        // parent and child dropdowns are open simultaneously (unique-ID rule).
        ul.querySelectorAll('li[id]').forEach(function(li) {
          li.id = ul.id + '-' + li.id;
        });
        if (ul.children.length) openDropdown(); else closeDropdown();
      });

      inp.addEventListener('keydown', function(e) {
        var items = getItems();
        if (!items.length && e.key !== 'Escape') return;
        if (e.key === 'ArrowDown')       { e.preventDefault(); setActive(activeIdx + 1); }
        else if (e.key === 'ArrowUp')    { e.preventDefault(); setActive(activeIdx - 1); }
        else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); selectItem(items[activeIdx]); }
        else if (e.key === 'Escape')     { e.preventDefault(); closeDropdown(); }
      });

      ul.addEventListener('click', function(e) {
        var li = e.target.closest('[data-id]');
        if (li) selectItem(li);
      });
    })();
    </script>
  </td>
</tr>
