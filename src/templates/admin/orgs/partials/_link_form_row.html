{# admin/orgs/partials/_link_form_row.html #}
<tr id="{% if l %}link-row-{{ l.id }}{% else %}link-row-new{% endif %}">
  <td colspan="4">
    <form {% if l %}
          hx-post="/admin/orgs/{{ org_id }}/links/{{ l.id }}/edit-row/"
          hx-target="#link-row-{{ l.id }}"
          {% else %}
          hx-post="/admin/orgs/{{ org_id }}/links/"
          hx-target="#link-row-new"
          {% endif %}
          hx-swap="outerHTML"
          style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
      <input type="url" name="url" required
             value="{{ l.url if l else '' }}" placeholder="https://" style="flex:2">
      <select name="link_type_id">
        <optgroup label="Social">
          {% for lt in link_types if lt.is_social %}
          <option value="{{ lt.id }}"{% if l and l.link_type_id == lt.id %} selected{% endif %}>
            {{ lt.display_name }}</option>
          {% endfor %}
        </optgroup>
        <optgroup label="General">
          {% for lt in link_types if not lt.is_social %}
          <option value="{{ lt.id }}"{% if l and l.link_type_id == lt.id %} selected{% endif %}>
            {{ lt.display_name }}</option>
          {% endfor %}
        </optgroup>
      </select>
      <label><input type="checkbox" name="is_active" value="true"
                    {% if l and l.is_active or not l %} checked{% endif %}> Active</label>
      <label><input type="checkbox" name="is_canonical" value="true"
                    {% if l and l.is_canonical %} checked{% endif %}> Canonical</label>
      <button type="submit" class="btn btn--sm btn--primary">Save</button>
      <button type="button" class="btn btn--sm btn--secondary"
              {% if l %}
              hx-get="/admin/orgs/{{ org_id }}/links/{{ l.id }}/read-row/"
              hx-target="#link-row-{{ l.id }}"
              hx-swap="outerHTML"
              {% else %}
              onclick="this.closest('tr').remove()"
              {% endif %}>Cancel</button>
    </form>
  </td>
</tr>
