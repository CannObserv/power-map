{# admin/orgs/partials/_address_form_row.html #}
<tr id="{% if a and a.id %}address-row-{{ a.id }}{% else %}address-row-new{% endif %}">
  <td colspan="4" style="padding:var(--space-2) var(--space-4)">
    <form {% if a and a.id %}
          hx-post="/admin/orgs/{{ org_id }}/addresses/{{ a.id }}/edit-row/"
          hx-target="#address-row-{{ a.id }}"
          {% else %}
          hx-post="/admin/orgs/{{ org_id }}/addresses/"
          hx-target="#address-row-new"
          {% endif %}
          hx-swap="outerHTML"
          style="display:grid;gap:var(--space-2)">
      {% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
      <div class="form-group" style="margin-bottom:0">
        <input type="text" name="country" id="address-country-input"
               aria-label="Country (ISO code)"
               placeholder="Country (ISO code, e.g. US, GB, CA)"
               maxlength="2"
               value="{{ a.country or 'US' if a else 'US' }}"
               hx-get="/admin/orgs/{{ org_id }}/addresses/country-format/"
               hx-trigger="change"
               hx-target="#address-structured-fields"
               hx-swap="innerHTML"
               hx-include="[name='country']">
      </div>

      <div id="address-structured-fields">
        {% include "admin/orgs/partials/_address_fields_partial.html" %}
      </div>
      <div style="display:flex;gap:var(--space-2);align-items:center">
        <div class="form-group" style="margin-bottom:0;flex:1">
          <select name="address_type" aria-label="Address type">
            {% for t in ('mailing', 'physical', 'other') %}
            <option value="{{ t }}"{% if a and a.address_type == t %} selected{% endif %}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;flex:2">
          <input type="text" name="display_name" aria-label="Address label" placeholder="Label (optional)"
                 value="{{ a.display_name or '' if a else '' }}">
        </div>
        <div style="display:flex;gap:var(--space-2);margin-left:auto;white-space:nowrap">
          <button type="submit" class="btn btn--sm btn--primary">Save</button>
          <button type="button" class="btn btn--sm btn--secondary"
                  {% if a and a.id %}
                  hx-get="/admin/orgs/{{ org_id }}/addresses/{{ a.id }}/read-row/"
                  hx-target="#address-row-{{ a.id }}"
                  hx-swap="outerHTML"
                  {% else %}
                  onclick="this.closest('tr').remove(); document.dispatchEvent(new CustomEvent('powerMap:newRowClosed'));"
                  {% endif %}>Cancel</button>
        </div>
      </div>
    </form>
  </td>
</tr>
