{# admin/orgs/partials/_jurisdiction_affiliation_form_row.html — affiliate a jurisdiction #}
<tr id="jur-affiliation-row-new">
  <td colspan="3" style="padding:var(--space-2) var(--space-4)">
    <form hx-post="/admin/orgs/{{ org_id }}/jurisdiction-affiliations/"
          hx-target="#jur-affiliation-row-new" hx-swap="outerHTML"
          style="display:flex;gap:var(--space-2);align-items:flex-end;flex-wrap:wrap">
      {% if errors.jurisdiction_id %}<div class="alert alert--error" role="alert">{{ errors.jurisdiction_id }}</div>{% endif %}
      {% if errors.affiliation_type_id %}<div class="alert alert--error" role="alert">{{ errors.affiliation_type_id }}</div>{% endif %}
      <div class="form-group" style="margin-bottom:0;position:relative;flex:1;min-width:12rem">
        <label for="jaff-jur-search-new">Jurisdiction</label>
        <input id="jaff-jur-search-new" type="text" autocomplete="off" placeholder="Type to search&hellip;"
               hx-get="/admin/jurisdictions/search/" hx-trigger="input changed delay:200ms"
               hx-target="#jaff-jur-results-new" hx-swap="innerHTML" hx-params="q" name="q"
               role="combobox" aria-expanded="false" aria-haspopup="listbox"
               aria-controls="jaff-jur-results-new" aria-autocomplete="list">
        <input type="hidden" name="jurisdiction_id" id="jaff-jur-id-new" value="{{ values.jurisdiction_id or '' }}">
        <ul id="jaff-jur-results-new" class="typeahead-results" role="listbox"></ul>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label for="jaff-type-new">Affiliation</label>
        <select id="jaff-type-new" name="affiliation_type_id">
          <option value="">— select —</option>
          {% for t in affiliation_types %}
          <option value="{{ t.id }}" {% if values.affiliation_type_id == t.id %}selected{% endif %}>{{ t.display_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div style="display:flex;gap:var(--space-2)">
        <button type="submit" class="btn btn--sm btn--primary">Add</button>
        <button type="button" class="btn btn--sm btn--secondary"
                onclick="this.closest('tr').remove(); document.dispatchEvent(new CustomEvent('powerMap:newRowClosed'));">Cancel</button>
      </div>
    </form>
  </td>
</tr>
<script>
  (function () {
    if (typeof window.initTypeaheadCombobox === 'function') {
      window.initTypeaheadCombobox({
        inputId: 'jaff-jur-search-new',
        listboxId: 'jaff-jur-results-new',
        hiddenId: 'jaff-jur-id-new',
      });
    }
  })();
</script>
