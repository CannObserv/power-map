{% for org in orgs %}
<tr class="{% if org.archived_at %}is-archived{% elif not org.active %}is-inactive{% endif %}">
  <td><a href="/admin/orgs/{{ org.id }}/">{{ org.canonical_name or '(unnamed)' }}</a></td>
  <td>
    {% if org.archived_at %}<span class="badge badge--archived">Archived</span>
    {% elif not org.active %}<span class="badge badge--inactive">Inactive</span>
    {% else %}<span class="badge badge--active">Active</span>{% endif %}
  </td>
  <td>{{ org.created_at.strftime('%Y-%m-%d') }}</td>
  <td><a href="/admin/orgs/{{ org.id }}/" class="btn btn--ghost btn--sm">Edit</a></td>
</tr>
{% else %}
<tr><td colspan="4" style="text-align:center;color:var(--color-text-muted)">No results</td></tr>
{% endfor %}
