{% extends "admin/base.html" %}
{% block title %}Organizations{% endblock %}
{% block breadcrumb %}
  <a href="/admin/">Dashboard</a><span class="breadcrumb__sep">›</span><span>Organizations</span>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Organizations</h1>
  <a href="/admin/orgs/new/" class="btn btn--primary">+ Add organization</a>
</div>
<div class="filter-card">
  <input type="search" name="q" value="{{ q }}" placeholder="Search by name…"
         aria-label="Search organizations" class="filter-card__search"
         hx-get="/admin/orgs/" hx-trigger="input delay:300ms, search"
         hx-target="#orgs-list-region" hx-include="[name='status']" hx-push-url="true">
  <div class="filter-card__controls">
    <div class="filter-card__field">
      <label for="orgs-status-filter">Status</label>
      <select id="orgs-status-filter" name="status"
              hx-get="/admin/orgs/" hx-trigger="change"
              hx-target="#orgs-list-region" hx-include="[name='q']" hx-push-url="true">
        <option value="active"   {% if status=='active'   %}selected{% endif %}>Active</option>
        <option value="inactive" {% if status=='inactive' %}selected{% endif %}>Inactive</option>
        <option value="archived" {% if status=='archived' %}selected{% endif %}>Archived</option>
      </select>
    </div>
  </div>
</div>
<div id="orgs-list-region">
  {% include "admin/orgs/_region.html" %}
</div>
{% endblock %}
