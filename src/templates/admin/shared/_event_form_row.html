{# admin/shared/_event_form_row.html — shared event create/edit form.
   Callers must set: _ev_url_base, _ev_row_prefix #}
<tr id="{% if ev %}{{ _ev_row_prefix }}-{{ ev.id }}{% else %}{{ _ev_row_prefix }}-new{% endif %}">
  <td colspan="6" style="padding:var(--space-3) var(--space-4)">
    {% if form_error %}
    <div class="alert alert--error" style="margin-bottom:var(--space-3)">{{ form_error }}</div>
    {% endif %}
    <form {% if ev %}
          hx-post="{{ _ev_url_base }}/events/{{ ev.id }}/edit-row/"
          hx-target="#{{ _ev_row_prefix }}-{{ ev.id }}"
          {% else %}
          hx-post="{{ _ev_url_base }}/events/"
          hx-target="#{{ _ev_row_prefix }}-new"
          {% endif %}
          hx-swap="outerHTML"
          style="display:grid;gap:var(--space-2)">
      <div style="display:flex;gap:var(--space-2);align-items:center">
        <div class="form-group" style="margin-bottom:0;flex:1">
          <select name="event_type_id">
            {% for et in event_types %}
            <option value="{{ et.id }}"
                    data-requires-linked="{{ et.requires_linked_entity | lower }}"
                    {% if ev and ev.event_type_id == et.id %} selected{% endif %}>{{ et.display_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;flex:1">
          <select name="visibility">
            <option value="public"{% if not ev or ev.visibility == 'public' %} selected{% endif %}>Public</option>
            <option value="legal_only"{% if ev and ev.visibility == 'legal_only' %} selected{% endif %}>Legal only</option>
            <option value="hidden"{% if ev and ev.visibility == 'hidden' %} selected{% endif %}>Hidden</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:var(--space-2);align-items:center">
        <div class="form-group" style="margin-bottom:0">
          <select name="event_month">
            <option value="">Month</option>
            <option value="1"{% if ev and ev.event_month == 1 %} selected{% endif %}>January</option>
            <option value="2"{% if ev and ev.event_month == 2 %} selected{% endif %}>February</option>
            <option value="3"{% if ev and ev.event_month == 3 %} selected{% endif %}>March</option>
            <option value="4"{% if ev and ev.event_month == 4 %} selected{% endif %}>April</option>
            <option value="5"{% if ev and ev.event_month == 5 %} selected{% endif %}>May</option>
            <option value="6"{% if ev and ev.event_month == 6 %} selected{% endif %}>June</option>
            <option value="7"{% if ev and ev.event_month == 7 %} selected{% endif %}>July</option>
            <option value="8"{% if ev and ev.event_month == 8 %} selected{% endif %}>August</option>
            <option value="9"{% if ev and ev.event_month == 9 %} selected{% endif %}>September</option>
            <option value="10"{% if ev and ev.event_month == 10 %} selected{% endif %}>October</option>
            <option value="11"{% if ev and ev.event_month == 11 %} selected{% endif %}>November</option>
            <option value="12"{% if ev and ev.event_month == 12 %} selected{% endif %}>December</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;width:5rem">
          <input type="number" name="event_day" placeholder="Day" min="1" max="31" step="1"
                 value="{{ ev.event_day if ev and ev.event_day is not none else '' }}">
        </div>
        <div class="form-group" style="margin-bottom:0;width:6rem">
          <input type="number" name="event_year" placeholder="Year" min="-9999" max="9999" step="1"
                 value="{{ ev.event_year if ev and ev.event_year is not none else '' }}">
        </div>
      </div>
      <details{% if ev and ev.event_hour is not none %} open{% endif %}>
        <summary style="font-size:var(--font-size-sm);color:var(--color-text-muted);cursor:pointer;user-select:none">Time</summary>
        <div style="display:flex;gap:var(--space-2);margin-top:var(--space-1)">
          <div class="form-group" style="margin-bottom:0;width:4rem">
            <input type="number" name="event_hour" placeholder="HH" min="0" max="23" step="1"
                   value="{{ ev.event_hour if ev and ev.event_hour is not none else '' }}">
          </div>
          <div class="form-group" style="margin-bottom:0;width:4rem">
            <input type="number" name="event_minute" placeholder="MM" min="0" max="59" step="1"
                   value="{{ ev.event_minute if ev and ev.event_minute is not none else '' }}">
          </div>
          <div class="form-group" style="margin-bottom:0;width:4rem">
            <input type="number" name="event_second" placeholder="SS" min="0" max="59" step="1"
                   value="{{ ev.event_second if ev and ev.event_second is not none else '' }}">
          </div>
        </div>
      </details>
      <div class="form-group" style="margin-bottom:0">
        <input type="text" name="event_place_text" placeholder="Place (optional)"
               value="{{ ev.event_place_text or '' if ev else '' }}">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <input type="text" name="event_place_address_id"
               placeholder="Address ID (optional — city/postal/street precision)"
               value="{{ ev.event_place_address_id or '' if ev else '' }}">
      </div>
      <div data-linked-entity-section>
        <label style="font-size:0.75rem;font-weight:600;display:block;color:var(--color-text-muted);margin-bottom:var(--space-1)">Linked Entity</label>
        <div style="display:flex;gap:var(--space-2);align-items:center">
          <div class="form-group" style="margin-bottom:0">
            <select name="linked_entity_type">
              <option value=""{% if not ev or not ev.linked_entity_type %} selected{% endif %}>— none —</option>
              <option value="person"{% if ev and ev.linked_entity_type == 'person' %} selected{% endif %}>Person</option>
              <option value="organization"{% if ev and ev.linked_entity_type == 'organization' %} selected{% endif %}>Organization</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;flex:1">
            <input type="text" name="linked_entity_id" placeholder="Entity ID"
                   value="{{ ev.linked_entity_id or '' if ev else '' }}">
          </div>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <textarea name="notes" rows="2" placeholder="Notes (optional)">{{ ev.notes or '' if ev else '' }}</textarea>
      </div>
      <div style="display:flex;gap:var(--space-2)">
        <button type="submit" class="btn btn--sm btn--primary">Save</button>
        <button type="button" class="btn btn--sm btn--secondary"
                {% if ev %}
                hx-get="{{ _ev_url_base }}/events/{{ ev.id }}/read-row/"
                hx-target="#{{ _ev_row_prefix }}-{{ ev.id }}"
                hx-swap="outerHTML"
                {% else %}
                onclick="this.closest('tr').remove(); document.dispatchEvent(new CustomEvent('powerMap:newEventRowClosed'));"
                {% endif %}>Cancel</button>
      </div>
    </form>
    <script>
    (function () {
      var form = document.currentScript.previousElementSibling;
      var sel = form.querySelector('[name="event_type_id"]');
      var section = form.querySelector('[data-linked-entity-section]');
      function sync() {
        var opt = sel.options[sel.selectedIndex];
        section.style.display = opt && opt.dataset.requiresLinked === 'true' ? '' : 'none';
      }
      sel.addEventListener('change', sync);
      sync();
    })();
    </script>
  </td>
</tr>
