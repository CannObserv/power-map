<div class="modal-backdrop" id="modal-slot">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Permanently delete?</h2>
    <p>This will permanently remove <strong>{{ entity_label }}</strong> and cannot be undone.</p>
    <div class="modal__actions">
      <button class="btn btn--ghost" onclick="document.getElementById('modal-slot').remove()">Cancel</button>
      <button class="btn btn--danger"
              hx-delete="{{ delete_url }}"
              hx-target="closest tr"
              hx-swap="outerHTML"
              hx-on::after-request="document.getElementById('modal-slot').remove()">
        Delete permanently
      </button>
    </div>
  </div>
</div>
