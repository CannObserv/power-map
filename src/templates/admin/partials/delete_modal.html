<div class="modal-backdrop" id="modal-slot">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Permanently delete?</h2>
    <p>This will permanently remove <strong>{{ entity_label }}</strong> and cannot be undone.</p>
    <div id="modal-error" class="alert alert--error" role="alert" hidden></div>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" onclick="window.__pmCloseModal()">Cancel</button>
      <button class="btn btn--danger"
              type="button"
              hx-delete="{{ delete_url }}"
              hx-target="closest tr"
              hx-swap="outerHTML"
              hx-on::after-request="window.__pmHandleDeleteResult(event)">
        Delete permanently
      </button>
    </div>
  </div>
</div>
<script>
(function () {
  var trigger = document.activeElement;
  var slot = document.getElementById('modal-slot');
  var modal = slot.querySelector('.modal');
  var focusable = Array.from(modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
  var first = focusable[0];
  var last = focusable[focusable.length - 1];

  function close() {
    modal.removeEventListener('keydown', trap);
    window.__pmCloseModal = null;
    window.__pmHandleDeleteResult = null;
    slot.remove();
    if (trigger && trigger.focus) trigger.focus();
  }

  function trap(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key !== 'Tab') return;
    if (e.shiftKey) {
      if (document.activeElement === first) { e.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  window.__pmHandleDeleteResult = function (event) {
    if (event.detail.successful) {
      close();
    } else {
      var status = event.detail.xhr.status;
      var msg = status === 409
        ? 'Cannot delete: archive the entity first.'
        : 'Delete failed (' + status + '). Please try again.';
      var errEl = document.getElementById('modal-error');
      errEl.textContent = msg;
      errEl.hidden = false;
    }
  };

  modal.addEventListener('keydown', trap);
  window.__pmCloseModal = close;
  if (first) first.focus();
})();
</script>
