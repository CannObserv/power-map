{% macro message(level, body, auto_dismiss_ms=4000) %}
<div class="flash flash--{{ level }}" role="alert">
  <div class="flash__body">{{ body | safe }}</div>
  <button class="flash__close" aria-label="Dismiss" onclick="this.parentElement.remove()">×</button>
</div>
<script>
(function() {
  var el = document.currentScript.previousElementSibling;
  var t = setTimeout(function() { if (el && el.parentElement) el.remove(); }, {{ auto_dismiss_ms }});
  el.addEventListener('mouseenter', function() { clearTimeout(t); });
  el.addEventListener('mouseleave', function() {
    t = setTimeout(function() { if (el && el.parentElement) el.remove(); }, {{ auto_dismiss_ms }});
  });
})();
</script>
{% endmacro %}

{# OOB wrapper — include at the end of any HTMX partial to inject a flash into #flash-region #}
{% macro oob(level, body, auto_dismiss_ms=4000) %}
<div id="flash-region" hx-swap-oob="beforeend">
  {{ message(level, body, auto_dismiss_ms) }}
</div>
{% endmacro %}
