{% extends "admin/base.html" %}
{% block title %}Roles{% endblock %}
{% block breadcrumb %}
  <a href="/admin/">Dashboard</a><span class="breadcrumb__sep">›</span><span>Roles</span>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Roles</h1>
  <div style="display:flex;gap:var(--space-2)">
    <span id="roles-list-merge-btn-wrap" style="display:inline-block"><button id="roles-list-merge-btn" class="btn btn--secondary" type="button">Merge</button></span>
    <a href="/admin/roles/new/" class="btn btn--primary">+ Add role</a>
  </div>
</div>
<div class="filter-card">
  <input type="search" name="q" value="{{ q }}" placeholder="Search by title…"
         aria-label="Search by title" class="filter-card__search"
         hx-get="/admin/roles/" hx-trigger="input delay:300ms, search"
         hx-target="#roles-list-region" hx-include="[name='org_q'],[name='status'],[name='page_size']" hx-push-url="true">
  <div class="filter-card__controls">
    <div class="filter-card__field">
      <label for="roles-org-filter">Organization</label>
      <input type="search" id="roles-org-filter" name="org_q" value="{{ org_q }}"
             placeholder="Filter by organization…"
             hx-get="/admin/roles/" hx-trigger="input delay:300ms, search"
             hx-target="#roles-list-region" hx-include="[name='q'],[name='status'],[name='page_size']" hx-push-url="true">
    </div>
    <div class="filter-card__field">
      <label for="roles-status-filter">Status</label>
      <select id="roles-status-filter" name="status"
              hx-get="/admin/roles/" hx-trigger="change"
              hx-target="#roles-list-region" hx-include="[name='org_q'],[name='q'],[name='page_size']" hx-push-url="true">
        <option value="active"   {% if status=='active'   %}selected{% endif %}>Active</option>
        <option value="archived" {% if status=='archived' %}selected{% endif %}>Archived</option>
        <option value="all"      {% if status=='all'      %}selected{% endif %}>All</option>
      </select>
    </div>
    <div class="filter-card__field">
      <label for="roles-page-size">Per page</label>
      <select id="roles-page-size" name="page_size"
              hx-get="/admin/roles/" hx-trigger="change"
              hx-target="#roles-list-region"
              hx-include="[name='q'],[name='org_q'],[name='status']"
              hx-vals='{"page": 1}'
              hx-push-url="true">
        <option value="25"  {% if page_size==25  %}selected{% endif %}>25</option>
        <option value="50"  {% if page_size==50  %}selected{% endif %}>50</option>
        <option value="100" {% if page_size==100 %}selected{% endif %}>100</option>
        <option value="250" {% if page_size==250 %}selected{% endif %}>250</option>
      </select>
    </div>
  </div>
</div>
<div id="roles-list-region" aria-live="polite" aria-atomic="false">
  {% include "admin/roles/_region.html" %}
</div>
{% endblock %}
