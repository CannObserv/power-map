{# admin/roles/partials/_assignment_edit_row.html — inline edit form for one assignment #}
<tr id="assignment-row-{{ ra.id }}">
  <td colspan="5" style="padding:var(--space-2) var(--space-4)">
    <form hx-post="/admin/roles/{{ role_id }}/assignments/{{ ra.id }}/edit-row/"
          hx-target="#assignments-table tbody"
          hx-swap="innerHTML"
          style="display:flex;gap:var(--space-2);align-items:flex-start;flex-wrap:wrap">
      <div style="flex:2;min-width:10rem;font-size:var(--font-size-sm);padding-top:var(--space-2)">
        <a href="/admin/people/{{ ra.person_id }}/">{{ ra.person_name or '(unnamed)' }}</a>
      </div>
      <div class="form-group" style="margin-bottom:0;flex:1;min-width:8rem">
        <input type="date" name="start_date" title="Start date"
               id="start-date-input-{{ ra.id }}"
               value="{{ ra.start_date.isoformat() if ra.start_date else '' }}">
      </div>
      <div class="form-group" style="margin-bottom:0;flex:1;min-width:8rem">
        <input type="date" name="end_date" title="End date"
               id="end-date-input-{{ ra.id }}"
               value="{{ ra.end_date.isoformat() if ra.end_date else '' }}"
               {% if ra.is_current %}disabled{% endif %}>
      </div>
      <div class="form-group" style="margin-bottom:0;display:flex;align-items:center;gap:var(--space-1)">
        <input type="checkbox" name="is_current" value="true"
               id="is-current-cb-{{ ra.id }}"
               {% if ra.is_current %}checked{% endif %}>
        <label for="is-current-cb-{{ ra.id }}" style="font-size:var(--font-size-sm);white-space:nowrap">Current</label>
      </div>
      <div style="display:flex;gap:var(--space-2);white-space:nowrap">
        <button type="submit" class="btn btn--sm btn--primary">Save</button>
        <button type="button" class="btn btn--sm btn--secondary"
                hx-get="/admin/roles/{{ role_id }}/assignments/{{ ra.id }}/read-row/"
                hx-target="#assignment-row-{{ ra.id }}"
                hx-swap="outerHTML">Cancel</button>
      </div>
    </form>
    <script>
    (function() {
      var cb    = document.getElementById('is-current-cb-{{ ra.id }}');
      var endDt = document.getElementById('end-date-input-{{ ra.id }}');
      cb.addEventListener('change', function() {
        if (cb.checked) { endDt.value = ''; endDt.disabled = true; }
        else { endDt.disabled = false; }
      });
    })();
    </script>
  </td>
</tr>
