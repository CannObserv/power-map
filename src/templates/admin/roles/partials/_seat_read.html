{# admin/roles/partials/_seat_read.html — seat structural fields (read) #}
{% if role.role_type_id %}
<div id="seat-details" style="margin-top:var(--space-5)">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)">
    <h3 class="field-group-label">Seat</h3>
    <span class="badge badge--seat">Seat</span>
  </div>
  <div style="border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);background:var(--color-surface-1);font-size:var(--font-size-sm);display:flex;gap:var(--space-6);flex-wrap:wrap">
    <div>
      <div class="field-group-label" style="font-size:var(--font-size-xs)">Office</div>
      <div>{{ role.role_type_name or role.role_type_slug }}</div>
    </div>
    <div>
      <div class="field-group-label" style="font-size:var(--font-size-xs)">Jurisdiction</div>
      <div style="color:{% if role.jurisdiction_id %}var(--color-text){% else %}var(--color-text-muted){% endif %}">{{ role.jurisdiction_name or role.jurisdiction_slug or '—' }}</div>
    </div>
    <div>
      <div class="field-group-label" style="font-size:var(--font-size-xs)">Qualifier</div>
      <div style="color:{% if role.qualifier %}var(--color-text){% else %}var(--color-text-muted){% endif %}">{{ role.qualifier or '—' }}</div>
    </div>
  </div>
</div>
{% endif %}
