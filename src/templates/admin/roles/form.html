{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if role else 'New' }} Role{% endblock %}
{% block breadcrumb %}
  <a href="/admin/">Dashboard</a><span class="breadcrumb__sep">›</span>
  <a href="/admin/roles/">Roles</a><span class="breadcrumb__sep">›</span>
  <span>{{ 'Edit' if role else 'New' }}</span>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit Role' if role else 'New Role' }}</h1>
</div>
<div class="entity-card">
  <form method="POST" action="{{ '/admin/roles/' + role.id + '/edit/' if role else '/admin/roles/new/' }}">
    <div class="form-group">
      <label for="organization_id">Organization <span aria-hidden="true">*</span></label>
      <select id="organization_id" name="organization_id" required>
        <option value="">— select organization —</option>
        {% for org in orgs %}
        <option value="{{ org.id }}" {% if role and role.organization_id == org.id %}selected{% endif %}>
          {{ org.name or org.id }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="title">Title <span aria-hidden="true">*</span></label>
      <input id="title" name="title" type="text" required value="{{ role.title if role else '' }}">
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="3">{{ role.notes if role else '' }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn--primary">{{ 'Save changes' if role else 'Create role' }}</button>
      <a href="{{ '/admin/roles/' + role.id + '/' if role else '/admin/roles/' }}" class="btn btn--ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
