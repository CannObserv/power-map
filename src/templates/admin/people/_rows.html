{% for person in people %}
<tr class="{% if person.archived_at %}is-archived{% endif %}">
  <td><a href="/admin/people/{{ person.id }}/">{{ person.canonical_name or '(unnamed)' }}</a></td>
  <td>
    {% if person.archived_at %}<span class="badge badge--archived">Archived</span>
    {% else %}<span class="badge badge--active">Active</span>{% endif %}
  </td>
  <td>{{ person.created_at.strftime('%Y-%m-%d') }}</td>
  <td><a href="/admin/people/{{ person.id }}/edit/" class="btn btn--ghost btn--sm">Edit</a></td>
</tr>
{% else %}
<tr><td colspan="4" style="text-align:center;color:var(--color-text-muted)">No results</td></tr>
{% endfor %}
