{# admin/people/partials/_pronouns_form.html — pronouns inline edit form #}
<div id="pronouns-field" style="margin-top:var(--space-5)">
  <form hx-post="/admin/people/{{ person.id }}/inline/pronouns/"
        hx-target="#pronouns-field"
        hx-swap="outerHTML">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)">
      <label for="pronouns-input" class="field-group-label">Pronouns</label>
      <div>
        <button type="submit" class="btn btn--primary btn--sm">Save</button>
        <button type="button" class="btn btn--secondary btn--sm"
                hx-get="/admin/people/{{ person.id }}/inline/pronouns/"
                hx-target="#pronouns-field"
                hx-swap="outerHTML">Cancel</button>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <input id="pronouns-input" type="text" name="personal_pronouns"
             value="{{ person.personal_pronouns or '' }}"
             placeholder="e.g. they/them, she/her, he/him">
    </div>
  </form>
</div>
