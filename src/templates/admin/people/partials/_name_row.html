{# admin/people/partials/_name_row.html — inline name read row #}
<tr id="name-row-{{ n.id }}">
  <td>{{ n.name }}</td>
  <td style="text-align:right">{{ n.name_type }}</td>
  <td style="text-align:right">{% if n.is_canonical %}<span class="badge badge--active">Yes</span>{% else %}—{% endif %}</td>
  <td style="text-align:right;white-space:nowrap">
    <button type="button" class="btn btn--sm btn--secondary"
            hx-get="/admin/people/{{ person_id }}/names/{{ n.id }}/edit-row/"
            hx-target="#name-row-{{ n.id }}"
            hx-swap="outerHTML">Edit</button>
    <button type="button" class="btn btn--sm btn--danger"
            hx-delete="/admin/people/{{ person_id }}/names/{{ n.id }}/"
            hx-target="#names-table tbody"
            hx-swap="innerHTML"
            hx-confirm="Delete this name?">Delete</button>
  </td>
</tr>
