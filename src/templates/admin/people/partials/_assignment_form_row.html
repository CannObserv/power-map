{# admin/people/partials/_assignment_form_row.html — multi-instance new-assignment form.
   row_key contract: docs/STYLE.md §34.
   Coexists with `_assignment_edit_row` (which namespaces ids with `{{ ra.id }}`). #}
{%- set row_key = row_key | default('new') -%}
<tr id="person-assignment-row-{{ row_key }}">
  <td colspan="6" style="padding:var(--space-2) var(--space-4)">
    <form hx-post="/admin/people/{{ person_id }}/assignments/"
          hx-target="#person-assignments-table tbody"
          hx-swap="innerHTML"
          style="display:flex;gap:var(--space-2);align-items:flex-start;flex-wrap:wrap">
      <div class="form-group" style="margin-bottom:0;flex:2;min-width:12rem;position:relative">
        <input type="text" autocomplete="off" placeholder="Search for a role…"
               id="role-search-display-{{ row_key }}"
               hx-get="/admin/roles/search/"
               hx-trigger="input changed delay:200ms"
               hx-target="#role-search-results-{{ row_key }}"
               hx-swap="innerHTML"
               hx-params="q"
               name="q"
               role="combobox"
               aria-expanded="false"
               aria-haspopup="listbox"
               aria-controls="role-search-results-{{ row_key }}"
               aria-autocomplete="list">
        <input type="hidden" name="role_id" id="role-id-hidden-{{ row_key }}">
        <ul id="role-search-results-{{ row_key }}" class="typeahead-results" role="listbox"></ul>
      </div>
      <div class="form-group" style="margin-bottom:0;flex:1;min-width:8rem">
        <input type="date" name="start_date" placeholder="Start date"
               title="Start date" value="{{ start_date_input or '' }}">
      </div>
      <div class="form-group" style="margin-bottom:0;flex:1;min-width:8rem">
        <input type="date" name="end_date" placeholder="End date"
               title="End date" id="end-date-input-{{ row_key }}" value="{{ end_date_input or '' }}">
      </div>
      <label class="toggle" style="align-self:center">
        <input type="checkbox" name="is_current" value="true" id="is-current-cb-{{ row_key }}"
               aria-label="Current"
               {% if is_current_input %}checked{% endif %}>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
      </label>
      <div style="display:flex;gap:var(--space-2);white-space:nowrap">
        <button type="submit" class="btn btn--sm btn--primary">Save</button>
        <button type="button" class="btn btn--sm btn--secondary"
                onclick="this.closest('tr').remove()">Cancel</button>
      </div>
    </form>
    <script>
    window.initTypeaheadCombobox({
      inputId: 'role-search-display-{{ row_key }}',
      listboxId: 'role-search-results-{{ row_key }}',
      hiddenId: 'role-id-hidden-{{ row_key }}',
    });
    (function () {
      var cb = document.getElementById('is-current-cb-{{ row_key }}');
      var endDt = document.getElementById('end-date-input-{{ row_key }}');
      cb.addEventListener('change', function () {
        if (cb.checked) { endDt.value = ''; endDt.disabled = true; }
        else { endDt.disabled = false; }
      });
      if (cb.checked) endDt.disabled = true;
    })();
    </script>
  </td>
</tr>
