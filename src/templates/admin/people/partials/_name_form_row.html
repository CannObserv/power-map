{# admin/people/partials/_name_form_row.html — inline name edit/new form row #}
<tr id="{% if n %}name-row-{{ n.id }}{% else %}name-row-new{% endif %}">
  <td colspan="4" style="padding:var(--space-2) var(--space-4)">
    <form {% if n %}
          hx-post="/admin/people/{{ person_id }}/names/{{ n.id }}/edit-row/"
          hx-target="#names-table tbody"
          hx-swap="innerHTML"
          {% else %}
          hx-post="/admin/people/{{ person_id }}/names/"
          hx-target="#names-table tbody"
          hx-swap="innerHTML"
          {% endif %}
          style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
      <div class="form-group" style="margin-bottom:0;flex:1;min-width:8rem">
        <input type="text" name="name" required value="{{ n.name if n else '' }}" placeholder="Name">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <select name="name_type" aria-label="Name type">
          {% for t in (
              'legal', 'preferred', 'alias', 'former', 'initials',
              'maiden', 'religious', 'stage', 'deadname',
              'reading', 'romanization', 'mrz'
          ) %}
          <option value="{{ t }}"{% if n and n.name_type == t %} selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <select name="visibility" aria-label="Visibility">
          {% for v in ('public', 'legal_only', 'hidden') %}
          <option value="{{ v }}"{% if (n and n.visibility == v) or (not n and v == 'public') %} selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </div>
      {# Locale typeahead — display input + hidden code value + listbox #}
      <div class="form-group" style="margin-bottom:0;position:relative;min-width:9rem">
        <input id="locale-search-display" type="text" autocomplete="off"
               placeholder="Locale (BCP 47)"
               value="{{ n.locale if n and n.locale else '' }}"
               hx-get="/admin/people/_locale_search"
               hx-trigger="input changed delay:200ms"
               hx-target="#locale-search-results"
               hx-swap="innerHTML"
               hx-params="q"
               name="q_locale"
               aria-label="Locale"
               role="combobox"
               aria-expanded="false"
               aria-haspopup="listbox"
               aria-controls="locale-search-results"
               aria-autocomplete="list">
        <input type="hidden" name="locale" id="locale-hidden"
               value="{{ n.locale if n and n.locale else '' }}">
        <ul id="locale-search-results" class="typeahead-results" role="listbox"></ul>
      </div>
      {# Script typeahead — same shape against iso15924_scripts #}
      <div class="form-group" style="margin-bottom:0;position:relative;min-width:9rem">
        <input id="script-search-display" type="text" autocomplete="off"
               placeholder="Script (ISO 15924)"
               value="{{ n.script if n and n.script else '' }}"
               hx-get="/admin/people/_script_search"
               hx-trigger="input changed delay:200ms"
               hx-target="#script-search-results"
               hx-swap="innerHTML"
               hx-params="q"
               name="q_script"
               aria-label="Script"
               role="combobox"
               aria-expanded="false"
               aria-haspopup="listbox"
               aria-controls="script-search-results"
               aria-autocomplete="list">
        <input type="hidden" name="script" id="script-hidden"
               value="{{ n.script if n and n.script else '' }}">
        <ul id="script-search-results" class="typeahead-results" role="listbox"></ul>
      </div>
      {# sort_as — plain text, free string for collation key overrides #}
      <div class="form-group" style="margin-bottom:0;min-width:9rem">
        <input type="text" name="sort_as" autocomplete="off"
               placeholder="Sort as (optional)"
               aria-label="Sort as"
               value="{{ n.sort_as if n and n.sort_as else '' }}">
      </div>
      <label class="toggle" style="flex-shrink:0">
        <input type="checkbox" name="is_canonical" value="true" aria-label="Canonical"
               {% if n and n.is_canonical %} checked{% endif %}>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
      </label>
      <div style="display:flex;gap:var(--space-2);margin-left:auto;white-space:nowrap">
        <button type="submit" class="btn btn--sm btn--primary">Save</button>
        <button type="button" class="btn btn--sm btn--secondary"
                {% if n %}
                hx-get="/admin/people/{{ person_id }}/names/{{ n.id }}/read-row/"
                hx-target="#name-row-{{ n.id }}"
                hx-swap="outerHTML"
                {% else %}
                onclick="this.closest('tr').remove()"
                {% endif %}>Cancel</button>
      </div>
    </form>
    <script>
      window.initTypeaheadCombobox({
        inputId: 'locale-search-display',
        listboxId: 'locale-search-results',
        hiddenId: 'locale-hidden',
      });
      window.initTypeaheadCombobox({
        inputId: 'script-search-display',
        listboxId: 'script-search-results',
        hiddenId: 'script-hidden',
      });
      // Phase 2b CR40: when the admin types in the typeahead but doesn't pick
      // a suggestion, mirror the display value to the hidden field on blur so
      // submission carries their input. Invalid codes then fail the FK check
      // and surface as a flash error rather than being silently discarded.
      (function () {
        ['locale', 'script'].forEach(function (kind) {
          var disp = document.getElementById(kind + '-search-display');
          var hidden = document.getElementById(kind + '-hidden');
          if (!disp || !hidden) return;
          disp.addEventListener('blur', function () {
            var v = (disp.value || '').trim();
            if (v !== hidden.value) hidden.value = v;
          });
        });
      })();
    </script>
  </td>
</tr>
