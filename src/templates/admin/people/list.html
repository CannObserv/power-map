{% extends "admin/base.html" %}
{% block title %}People{% endblock %}
{% block breadcrumb %}
  <a href="/admin/">Dashboard</a><span class="breadcrumb__sep">›</span><span>People</span>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1>People</h1>
  <a href="/admin/people/new/" class="btn btn--primary">+ Add person</a>
</div>
<div class="filter-card">
  <input type="search" name="q" value="{{ q }}" placeholder="Search by name…"
         aria-label="Search people" class="filter-card__search"
         hx-get="/admin/people/" hx-trigger="input delay:300ms, search"
         hx-target="#people-list-region" hx-include="[name='status']" hx-push-url="true">
  <div class="filter-card__controls">
    <div class="filter-card__field">
      <label for="people-status-filter">Status</label>
      <select id="people-status-filter" name="status"
              hx-get="/admin/people/" hx-trigger="change"
              hx-target="#people-list-region" hx-include="[name='q']" hx-push-url="true">
        <option value="active"   {% if status=='active'   %}selected{% endif %}>Active</option>
        <option value="archived" {% if status=='archived' %}selected{% endif %}>Archived</option>
      </select>
    </div>
  </div>
</div>
<div id="people-list-region">
  {% include "admin/people/_region.html" %}
</div>
{% endblock %}
