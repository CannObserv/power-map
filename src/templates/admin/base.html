<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} — power-map</title>
  <link rel="stylesheet" href="/static/admin/admin.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="admin-layout" hx-boost="true">
    <header class="admin-topbar">
      <button class="admin-topbar__menu-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="admin-sidebar">&#9776;</button>
      <a class="admin-topbar__brand" href="/admin/">
        <img src="/static/images/cannabis_observer-icon-square.svg"
             alt="" aria-hidden="true" class="admin-topbar__brand-icon">
        Power Map
      </a>
      <nav aria-label="Breadcrumb" class="breadcrumb">{% block breadcrumb %}{% endblock %}</nav>
      <div class="admin-topbar__user">
        <span>{{ user.email }}</span>
        <form method="POST" action="/__exe.dev/logout" style="margin:0">
          <button type="submit" class="btn btn--ghost btn--sm">Log out</button>
        </form>
      </div>
    </header>
    <div class="admin-nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
    <nav class="admin-sidebar" id="admin-sidebar" aria-label="Entity navigation">
      <span class="admin-sidebar__group-label">Entities</span>
      <a class="admin-sidebar__link" href="/admin/people/" {% if active_section == 'people' %}aria-current="page"{% endif %}>People</a>
      <a class="admin-sidebar__link" href="/admin/orgs/" {% if active_section == 'orgs' %}aria-current="page"{% endif %}>Organizations</a>
      <a class="admin-sidebar__sublink" href="/admin/orgs/duplicates/" {% if active_section == 'orgs_duplicates' %}aria-current="page"{% endif %}>Duplicates<span hx-get="/admin/orgs/duplicate-count-badge/" hx-trigger="load" hx-swap="innerHTML"></span></a>
      <a class="admin-sidebar__link" href="/admin/roles/" {% if active_section == 'roles' %}aria-current="page"{% endif %}>Roles</a>
      <a class="admin-sidebar__link" href="/admin/role-assignments/" {% if active_section == 'role_assignments' %}aria-current="page"{% endif %}>Assignments</a>
      <span class="admin-sidebar__group-label">Reference</span>
      <a class="admin-sidebar__link" href="/admin/lookups/platforms/" {% if active_section == 'lookups' %}aria-current="page"{% endif %}>Lookups</a>
      <span class="admin-sidebar__group-label">Ingestion</span>
      <a class="admin-sidebar__link" href="/admin/imports/" {% if active_section == 'imports' %}aria-current="page"{% endif %}>Import History</a>
    </nav>
    <main id="main-content" class="admin-main">{% block content %}{% endblock %}
      <footer class="admin-footer">
        A project of
        <img src="/static/images/cannabis_observer-icon-square.svg"
             alt="" aria-hidden="true" class="admin-footer__icon">
        <a href="https://cannabis.observer/" target="_blank" rel="noopener noreferrer">Cannabis Observer</a>
        🌱🏛️🔍
      </footer>
    </main>
  </div>
  <div id="flash-region" class="flash-region" aria-live="polite" aria-atomic="false">{% block flash %}{% endblock %}</div>
  <script>
    (function () {
      var toggle = document.getElementById('nav-toggle');
      var sidebar = document.getElementById('admin-sidebar');
      var backdrop = document.getElementById('nav-backdrop');
      function open() {
        sidebar.classList.add('is-open');
        backdrop.classList.add('is-visible');
        backdrop.removeAttribute('aria-hidden');
        toggle.setAttribute('aria-expanded', 'true');
        var first = sidebar.querySelector('a, button');
        if (first) first.focus();
      }
      function close() {
        sidebar.classList.remove('is-open');
        backdrop.classList.remove('is-visible');
        backdrop.setAttribute('aria-hidden', 'true');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      }
      toggle.addEventListener('click', function () { sidebar.classList.contains('is-open') ? close() : open(); });
      backdrop.addEventListener('click', close);
      sidebar.addEventListener('click', function (e) { if (e.target.closest('a')) close(); });
      document.removeEventListener('keydown', document.__pmNavKeydown);
      document.__pmNavKeydown = function (e) { if (e.key === 'Escape' && sidebar.classList.contains('is-open')) close(); };
      document.addEventListener('keydown', document.__pmNavKeydown);
    })();
  </script>
</body>
</html>
