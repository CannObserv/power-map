version: 2

models:
  - name: stg_usa_wa__persons
    columns:
      - name: entity_id
        tests: [unique, not_null]
      - name: name_full
        tests: [not_null]

  - name: stg_usa_wa__person_crosswalk
    columns:
      - name: entity_id
        tests: [not_null]
      - name: natural_key
        tests: [unique, not_null]

  - name: stg_pm__producer_crosswalk
    columns:
      - name: producer_id
        tests: [not_null]
      - name: resolution
        tests:
          - accepted_values:
              values: [live, archived, merged, deleted_no_successor, missing, cycle]

  - name: stg_pm__curation_overlay
    description: The overlay's field vocabulary is enforced here, per the design — a row naming a column no model maps fails the build.
    columns:
      - name: entity_type
        tests:
          - accepted_values:
              values: [person, organization, role, assignment]
      - name: field
        tests:
          - accepted_values:
              values: [name]

  - name: int_person_identity
    columns:
      - name: producer_id
        tests: [unique, not_null]
      - name: survivor_producer_id
        tests: [not_null]

  - name: desired_people
    columns:
      - name: producer_id
        tests: [unique, not_null]
      - name: pm_id
        tests: [unique]

  - name: desired_person_names
    columns:
      - name: producer_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('desired_people')
              field: producer_id
      - name: name
        tests: [not_null]
      - name: name_type
        tests:
          - accepted_values:
              values: [legal]

  - name: desired_person_merges
    columns:
      - name: loser_pm_id
        tests: [unique, not_null]
      - name: survivor_pm_id
        tests: [not_null]
