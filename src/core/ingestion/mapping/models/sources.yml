version: 2

# Every source is a file path resolved by `run_dbt` into an env var: a named
# snapshot version for each usa-wa dataset (never "latest" — #499 pins what it
# applies), and the `_pm/` Parquet exports of PM's own tables. An unset var
# renders as '' so `dbt parse` succeeds without data; a run then fails on the
# read, which is the right place to fail.
#
# Each usa_wa source also carries its pin (#536): the `schema_major` and
# `contract_hash` its model was written against. They are the nightly puller's
# whole subscription — a version whose contract hash differs is refused, not
# landed, and the major only says whether the models need a change or a review.
# A shape change and its re-pin belong in the same diff. Majors are per dataset
# and never comparable across datasets (usa-wa#385).
sources:
  - name: usa_wa
    description: usa-wa's published conformed datasets, verbatim from the snapshot store (#496).
    tables:
      - name: persons
        meta:
          external_location: "read_csv('{{ env_var('PM_SRC_PERSONS', '') }}', header=true, all_varchar=true)"
          schema_major: 2
          contract_hash: "sha256:dddb4e9f24859f3522f22c1f0e9ba4f31f6cc6faba05b7ef601a568be97c3a7f"
      - name: organizations
        meta:
          external_location: "read_csv('{{ env_var('PM_SRC_ORGANIZATIONS', '') }}', header=true, all_varchar=true)"
          schema_major: 1
          # 1.1.0 (usa-wa#428) appends `active`; 1.2.0 derives it false for an org a
          # succeeded_by/merged_with link closes (INV2), contract unchanged. PM keeps
          # its own flag: `active` is read only by tests/org_active_divergence.sql (#592).
          contract_hash: "sha256:907ee1ce75ffe84d9bc31a0038e1f44c4952d35abab52adaef3f943c2fb7278f"
      - name: person_crosswalk
        description: usa-wa's own crosswalk — entity → source keys, with merged_into tombstones (design § gap E).
        meta:
          external_location: "read_csv('{{ env_var('PM_SRC_PERSON_CROSSWALK', '') }}', header=true, all_varchar=true)"
          schema_major: 2
          contract_hash: "sha256:419fdff3370e4b25464108e9a43892ed8f15eda534777bda2cc93f91ac830d81"
      - name: org_crosswalk
        meta:
          external_location: "read_csv('{{ env_var('PM_SRC_ORG_CROSSWALK', '') }}', header=true, all_varchar=true)"
          schema_major: 1
          contract_hash: "sha256:f3c0b7f7247675e72bf8dec31a8d15d62f35d284e2a4c5eb17380e05cc451104"
      - name: assignments
        description: Spans, each identified by its structural span_key (#525, #527).
        meta:
          external_location: "read_csv('{{ env_var('PM_SRC_ASSIGNMENTS', '') }}', header=true, all_varchar=true)"
          schema_major: 1
          contract_hash: "sha256:8f7ac44291103ac59140197e322358e438f213735b0f0824fcf350416197df5c"
      - name: roles
        meta:
          external_location: "read_csv('{{ env_var('PM_SRC_ROLES', '') }}', header=true, all_varchar=true)"
          schema_major: 1
          contract_hash: "sha256:9c4d5880f4c8a22be6c9d87859dcdc21c2879a0304a5de4dca8fe2bae26c7554"
      - name: org_lineage
        description: Committee links (`succeeded_by` / `merged_with` / `split_from`), keyed (subject, slug, linked); a superseded link drops out of the next version (usa-wa#447, #592).
        meta:
          external_location: "read_csv('{{ env_var('PM_SRC_ORG_LINEAGE', '') }}', header=true, all_varchar=true)"
          schema_major: 1
          contract_hash: "sha256:a7585012f837a8c0d2c79e43aff97c82b60a0b176702c4b2e63420e39d8dc019"

  - name: pm
    description: PM's own tables, exported to Parquet by scripts/export_pm_tables.py so the models never open a database connection.
    tables:
      - name: producer_crosswalk
        description: The #495 seed — producer id → PM id, with resolution.
        meta:
          external_location: "read_parquet('{{ env_var('PM_SRC_PRODUCER_CROSSWALK', '') }}')"
      - name: curation_overlay
        description: PM-wins overrides on producer-owned fields, joined as COALESCE(overlay, mapped).
        meta:
          external_location: "read_parquet('{{ env_var('PM_SRC_CURATION_OVERLAY', '') }}')"
      - name: role_types
        description: The role-type vocabulary (#266) — read for the qualifier policies its triggers enforce.
        meta:
          external_location: "read_parquet('{{ env_var('PM_SRC_ROLE_TYPES', '') }}')"
      - name: organizations
        description: PM's own organizations.active, which the applier never writes — read only by the active hint (#592).
        meta:
          external_location: "read_parquet('{{ env_var('PM_SRC_PM_ORGANIZATIONS', '') }}')"
