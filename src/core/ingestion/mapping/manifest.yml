# The ownership manifest: what each desired-state table claims, how far that
# claim reaches, and how a row binds to a PM table. This is the contract the
# applier (#499) reads; `manifest.py` is its typed loader.
#
#   key            the columns that identify a row within the table
#   retraction     what an absent row means for a PM row in scope:
#                    none    — assert presence only; absence says nothing
#                    report  — absence is reported, never acted on (safeguard 2)
#                    archive — absence archives the PM row, and a row the
#                              applier archived restores when it returns (#527)
#   owned_columns  the PM columns the producer asserts; everything else on the
#                  row is PM's, column-scoped (safeguard 4)
#   owned_event_types  events only: retraction-as-absence reaches these types
#                  and no others — 315 org events in PM have no producer column
#   overlay        the curation_overlay field that pins the owned value (#498):
#                  (entity, overlay) is the pair a curator's pin is keyed on.
#                  Required on column and child tables, refused elsewhere. A
#                  binding owning several columns maps each to its field (#527)
#   target         the binding (v2): one of four shapes the applier interprets
#                    entity  — a row in an entity table: identity, create,
#                              retraction. `identity` names what a create writes
#                              (a reference resolves through the crosswalk),
#                              `unique_live` the partial index a create, restore
#                              or move must not collide on, `supersession` the
#                              tuple an archive is paired on in the report, and
#                              `cascades` the rows the database archives with it
#                    column  — columns on that row (columns: desired → PM);
#                              `asserts_null` names those whose null clears
#                    child   — a keyed child row of the entity; `match` is
#                              any_then_canonical (any row of the type carrying
#                              the value satisfies; else the canonical row is
#                              the one in dispute) or key (match on the key
#                              columns among unarchived rows; >1 is a conflict)
#                    merge   — a producer tombstone: the loser's PM row folds into
#                              the survivor's. `primitive` names the core merge
#                              that acts on it (#514); without one, report-only
#
# Persons and organizations are report-only: absence from WA data is not
# nonexistence. Assignments archive (#527), gated like creates — nothing archives
# until a run allows it, and the first such run is #501's supervised pass.
version: 2

# What an --execute refuses to exceed. A dry run always completes and records
# its verdict; these decide only whether writing is allowed. `updates` is
# unlimited by default — #501 passes --max-updates for the flip.
thresholds:
  creates: 0
  merges: 0
  conflicts: 0
  stale: 0
  archives: 0
  restores: 0
  updates: null
# Consecutive clean dry runs, with the same diff digest, before --execute is offered.
streak: 3

tables:
  desired_people:
    entity: person
    key: [producer_id]
    pm_key: pm_id
    retraction: report
    owned_columns: []          # usa-wa fills no column on people
    target:
      shape: entity
      table: people
  desired_person_names:
    entity: person
    key: [producer_id, name_type]
    pm_key: pm_id
    retraction: none           # PM keeps every other name; 3,121 rows for 3,118 people
    owned_columns: [name]
    overlay: name
    target:
      shape: child
      table: person_names
      parent: person_id
      columns: {name: name, name_type: name_type}
      match: any_then_canonical
      type_column: name_type
      canonical: is_canonical
      insert_defaults: {visibility: public}
      hint_on_create: true     # a create whose name PM already holds is probably a twin
  desired_person_merges:
    entity: person
    key: [loser_pm_id]
    pm_key: loser_pm_id
    retraction: none           # gap E: a re-point instruction, not a row to diff
    owned_columns: [survivor_pm_id]   # null = survivor out of scope (unanchored, a create, archived): report, never act
    target:
      shape: merge
      table: people            # where the loser and survivor are checked live and unarchived
      primitive: person        # src/core/person_merge.py::merge_person_into (#514)
  desired_organizations:
    entity: organization
    key: [producer_id]
    pm_key: pm_id
    retraction: report
    owned_columns: []
    target:
      shape: entity
      table: organizations
  desired_organization_parents:
    entity: organization
    key: [producer_id]
    pm_key: pm_id
    retraction: none           # an absent row is silence, not a null parent
    owned_columns: [parent_pm_id]
    overlay: parent_id
    target:
      shape: column
      table: organizations
      columns: {parent_pm_id: parent_id}
  desired_organization_names:
    entity: organization
    key: [producer_id, name_type]
    pm_key: pm_id
    retraction: none           # 310 legal + 13 former rows stay PM's
    owned_columns: [name]
    overlay: legal_name
    target:
      shape: child
      table: organization_names
      parent: organization_id
      columns: {name: name, name_type: name_type}
      match: any_then_canonical
      type_column: name_type
      canonical: is_canonical
      hint_on_create: true
  desired_organization_acronyms:
    entity: organization
    key: [producer_id]
    pm_key: pm_id
    retraction: none           # 240 acronym rows on 219 orgs; the producer has 186
    owned_columns: [acronym]
    overlay: acronym
    target:
      shape: child
      table: organization_acronyms
      parent: organization_id
      columns: {acronym: acronym}
      match: any_then_canonical   # no type_column: every row of the table is "the type"
      canonical: is_canonical
  desired_organization_merges:
    entity: organization
    key: [loser_pm_id]
    pm_key: loser_pm_id
    retraction: none
    owned_columns: [survivor_pm_id]   # null = survivor out of scope (unanchored, a create, archived): report, never act
    target:
      shape: merge             # no primitive: report-only until #520 binds the org merge
  desired_entity_events:
    entity: organization
    key: [producer_id, event_type]   # never pm_id: a create has none (CR 19)
    pm_key: pm_id
    retraction: report
    owned_event_types: [dissolved]
    owned_columns: [event_year]   # month/day: PM holds finer precision on 5 of 152
    overlay: dissolved_year
    target:
      shape: child
      table: entity_events
      parent: entity_id
      columns: {event_year: event_year, event_type: event_type_id}
      constants: {entity_type: organization}
      match: key
      key_columns: [event_type]
      lookups:
        event_type: {table: entity_event_types, from: slug, to: id}
      archived: archived_at
      insert_defaults: {visibility: public}
  desired_role_assignments:
    entity: assignment
    key: [producer_id]           # the published span_key (#525)
    pm_key: pm_id
    retraction: archive          # #527: absent spans archive; the applier's own restore
    owned_columns: []            # the dates are desired_role_assignment_dates'
    target:
      shape: entity
      table: role_assignments
      identity:                  # written once, at create
        person_producer_id: {column: person_id, entity: person}
        role_producer_id: {column: role_id, entity: role}
        start_date: start_date
      unique_live: [person_id, role_id, start_date]   # uq_role_assignment_person_role_start
      supersession: [person_id, role_id]              # usa-wa#289: a collapsed span
      cascades:                  # trg_cascade_assignment_relationships (#301)
        role_assignment_relationships: [from_assignment_id, to_assignment_id]
  desired_role_assignment_dates:
    entity: assignment
    key: [producer_id]
    pm_key: pm_id
    retraction: none
    owned_columns: [start_date, end_date, is_current]
    overlay: {start_date: start_date, end_date: end_date, is_current: is_current}
    target:
      shape: column
      table: role_assignments
      columns: {start_date: start_date, end_date: end_date, is_current: is_current}
      asserts_null: [end_date]   # an open span clears PM's end date
  desired_roles:
    entity: role
    key: [producer_id]           # usa-wa's role entity_id
    pm_key: pm_id
    retraction: archive          # #529: absent roles archive, unless PM rows depend on them
    owned_columns: []            # the title is desired_role_titles'
    target:
      shape: entity
      table: roles
      identity:                  # written once, at create
        org_producer_id:   {column: organization_id, entity: organization}
        role_type:         {column: role_type_id, lookup: {table: role_types, from: slug, to: id}}
        jurisdiction_slug: {column: jurisdiction_id, lookup: {table: jurisdictions, from: slug, to: id}}
        qualifier:         qualifier
        title:             title
      unique_live:               # #261 split role identity by jurisdiction
        - columns: [organization_id, role_type_id, jurisdiction_id, qualifier]
          when: {jurisdiction_id: not_null}        # uq_role_structural
        - columns: [organization_id, title]
          fold: {title: lower}                     # uq_role_org_title
          when: {jurisdiction_id: null}
      dependents:                # a role archive must strand no live assignment
        role_assignments: [role_id]
  desired_role_titles:
    entity: role
    key: [producer_id]
    pm_key: pm_id
    retraction: none
    owned_columns: [title]
    overlay: title
    target:
      shape: column
      table: roles
      columns: {title: title}
