[project]
name = "power-map-client"
# The app's version, stamped by `uv run python -m scripts.regenerate_client`
# (#618): client X.Y.Z is generated from power-map X.Y.Z and pinned as tag vX.Y.Z.
version = "0.59.6"
description = "Python client for the power-map public API, generated from its OpenAPI schema."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Exactly what the package imports (tests/clients/python/test_dependencies.py).
    "attrs>=24",
    "httpx>=0.28.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_map_client"]
