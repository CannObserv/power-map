repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        language: system
        entry: uv run ruff check .
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff (format check)
        language: system
        entry: uv run ruff format --check .
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (unit)
        language: system
        # Gated (#751): a commit staging only skills-vendor/ pointers and
        # .skills/doctor.sh — the SessionStart hook's daily bump, which has 120 s
        # — runs the subset before `:::` instead. docs/SKILLS.md § Auto-refresh hook.
        entry: >-
          bash scripts/precommit-vendor-gate.sh pytest
          uv run --group seed pytest --no-cov -x -m "vendored and not integration and not browser"
          ::: uv run --group seed pytest --no-cov -x -m "not integration and not browser"
        pass_filenames: false
        always_run: true

      - id: eslint
        name: eslint
        language: system
        entry: npm run lint:js
        pass_filenames: false
        files: \.js$

      - id: prettier
        name: prettier (check)
        language: system
        entry: npm run format:js:check
        pass_filenames: false
        files: \.js$

      - id: vitest
        name: vitest
        language: system
        # Gated (#751); no JS test reads the vendored tree, so no subset.
        entry: >-
          bash scripts/precommit-vendor-gate.sh vitest
          ::: npm run test:js
        pass_filenames: false
        always_run: true

      - id: bats
        name: bats (shell tests)
        language: system
        # Gated (#751); tests/test_vendored_subset.py keeps the file list complete.
        entry: >-
          bash scripts/precommit-vendor-gate.sh bats
          npx --no-install bats tests/sh/claude_hooks.bats tests/sh/pre_ship.bats
          tests/sh/pre_ship_wrapper.bats tests/sh/precommit_vendor_gate.bats
          tests/sh/worktree_setup.bats
          ::: npm run test:sh
        pass_filenames: false
        always_run: true

      - id: shellcheck
        name: shellcheck
        language: system
        entry: uv run shellcheck
        files: ^(scripts/.*\.sh|\.claude/hooks/.*\.sh)$
        # These hooks are symlinks into vendored skills (skills-vendor policy:
        # never edit; targets absent until the submodule is initialised).
        # pre-commit passes regular files only, so a symlinked hook is already
        # skipped — the list is the stated intent, not the mechanism.
        # socraticode-reminder joined it in #463, when the 12-tool divergence
        # retired and the hand-authored copy became a symlink like the others.
        exclude: ^\.claude/hooks/(context-budget-guard|skills-submodule-update|socraticode-reminder)\.sh$

      - id: check-version-sync
        name: version sync (pyproject.toml == package.json == package-lock.json == clients/python)
        language: system
        entry: scripts/check_version_sync.sh
        pass_filenames: false
        files: ^(pyproject\.toml|package\.json|package-lock\.json|clients/python/pyproject\.toml)$

      - id: terraform-fmt
        name: terraform fmt (check)
        language: system
        entry: terraform fmt -check -recursive infra/terraform/
        pass_filenames: false
        files: \.tf$
