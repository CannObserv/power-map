repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        language: system
        entry: uv run ruff check .
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff (format check)
        language: system
        entry: uv run ruff format --check .
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (unit)
        language: system
        entry: uv run pytest --no-cov -x -m "not integration"
        pass_filenames: false
        always_run: true

      - id: eslint
        name: eslint
        language: system
        entry: npm run lint:js
        pass_filenames: false
        files: \.js$

      - id: prettier
        name: prettier (check)
        language: system
        entry: npm run format:js:check
        pass_filenames: false
        files: \.js$

      - id: vitest
        name: vitest
        language: system
        entry: npm run test:js
        pass_filenames: false
        always_run: true

      - id: check-version-sync
        name: version sync (pyproject.toml == package.json)
        language: system
        entry: scripts/check_version_sync.sh
        pass_filenames: false
        files: ^(pyproject\.toml|package\.json)$
