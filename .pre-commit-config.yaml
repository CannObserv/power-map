repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        language: system
        entry: uv run ruff check .
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff (format check)
        language: system
        entry: uv run ruff format --check .
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (unit)
        language: system
        # Skipped on the refresh hook's own commit (.skills/refresh-skip-hooks,
        # #755); pytest-vendored runs there instead. docs/SKILLS.md § Auto-refresh hook.
        entry: uv run --group seed pytest --no-cov -x -m "not integration and not browser"
        pass_filenames: false
        always_run: true

      # The vendored subsets (#755): the refresh hook's commit skips pytest,
      # vitest and bats (.skills/refresh-skip-hooks), so what a skills-vendor/
      # bump can break runs here. tests/test_vendored_subset.py keeps both
      # lists complete. Files, not -m vendored: the marker collects the suite.
      - id: pytest-vendored
        name: pytest (reads skills-vendor/)
        language: system
        entry: >-
          uv run --group seed pytest --no-cov -x -q
          tests/scripts/test_pre_ship_gate.py
          tests/scripts/test_write_db_secrets.py
          tests/test_doc_sensitive_paths.py
          tests/test_no_channel_urls.py
          tests/test_outbox_retired_refs.py
          tests/test_retired_skill_refs.py
          tests/test_skills_listing.py
          tests/test_socraticode_doc_parity.py
          tests/test_socraticode_health_parity.py
          tests/test_socraticode_session_pin.py
          tests/test_vendor_skills.py
          tests/test_vendored_subset.py
        pass_filenames: false
        always_run: true

      - id: bats-vendored
        name: bats (reads skills-vendor/)
        language: system
        entry: >-
          npx --no-install bats tests/sh/claude_hooks.bats tests/sh/pre_ship.bats
          tests/sh/pre_ship_wrapper.bats tests/sh/worktree_setup.bats
        pass_filenames: false
        always_run: true

      - id: eslint
        name: eslint
        language: system
        entry: npm run lint:js
        pass_filenames: false
        files: \.js$

      - id: prettier
        name: prettier (check)
        language: system
        entry: npm run format:js:check
        pass_filenames: false
        files: \.js$

      - id: vitest
        name: vitest
        language: system
        # Skipped on the refresh hook's commit (#755); no JS test reads the
        # vendored tree, so no subset.
        entry: npm run test:js
        pass_filenames: false
        always_run: true

      - id: bats
        name: bats (shell tests)
        language: system
        # Skipped on the refresh hook's commit (#755); bats-vendored runs there.
        entry: npm run test:sh
        pass_filenames: false
        always_run: true

      - id: shellcheck
        name: shellcheck
        language: system
        entry: uv run shellcheck
        files: ^(scripts/.*\.sh|\.claude/hooks/.*\.sh)$
        # These hooks are symlinks into vendored skills (skills-vendor policy:
        # never edit; targets absent until the submodule is initialised).
        # pre-commit passes regular files only, so a symlinked hook is already
        # skipped — the list is the stated intent, not the mechanism.
        # socraticode-reminder joined it in #463, when the 12-tool divergence
        # retired and the hand-authored copy became a symlink like the others.
        exclude: ^\.claude/hooks/(context-budget-guard|skills-submodule-update|socraticode-reminder)\.sh$

      - id: check-version-sync
        name: version sync (pyproject.toml == package.json == package-lock.json == clients/python)
        language: system
        entry: scripts/check_version_sync.sh
        pass_filenames: false
        files: ^(pyproject\.toml|package\.json|package-lock\.json|clients/python/pyproject\.toml)$

      - id: terraform-fmt
        name: terraform fmt (check)
        language: system
        entry: terraform fmt -check -recursive infra/terraform/
        pass_filenames: false
        files: \.tf$
