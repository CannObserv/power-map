# power-map#574: needrestart lists restarts, never performs them.
#
# apt's hook runs `needrestart -m u` after every dpkg run, and Ubuntu's patch
# makes that AUTOMATIC restarts when this key is unset - the stock state. A
# python3.12 or libssl3t64 security update would then restart power-map.service,
# whose ExecStartPre applies the schema to the managed DB, mid-apply and without
# the owner's approval. With the key set, needrestart prints "Disabling Ubuntu
# mode, explicit restart mode configured" and only lists. Same shape as
# CannObserv/broker ad03a3d, CannObserv/archiver 4409060, CannObserv/usa-wa#432.
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive
# mode. A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
