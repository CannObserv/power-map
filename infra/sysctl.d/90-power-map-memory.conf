# Reserve for atomic allocations (#541). With no swap, the kernel fails atomic
# allocations in unrelated processes (tailscaled, ksoftirqd) before it kills
# anything; the kernel default here was 10993. earlyoom (package defaults) is
# the other half: it kills before the reserve is reached.
# Install: /etc/sysctl.d/ + `sysctl --system` (docs/COMMANDS.md).
vm.min_free_kbytes = 65536
