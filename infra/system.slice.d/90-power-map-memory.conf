# Makes power-map.service's MemoryLow= real (#541). cgroup v2 protection is
# hierarchical and this host mounts cgroup2 without memory_recursiveprot, so a
# child keeps at most what system.slice grants — and the slice's default is 0.
# Keep this >= the sum of every unit's MemoryLow= (tests/test_infra_host_memory.py).
# Install: /etc/systemd/system/system.slice.d/ + daemon-reload (docs/COMMANDS.md).
[Slice]
MemoryLow=512M
