# Where the host runs each infra/ file (#560). The host never runs these files,
# only copies of them; scripts/check_infra_drift.py (power-map-infra-drift.timer)
# compares each pair daily. Every file under infra/ except terraform/ and this
# one is listed — tests/scripts/test_check_infra_drift.py fails otherwise, and
# checks each host file's path against its `sudo install -t` line in
# docs/COMMANDS.md. Paths are absolute.

