# Keep tailscaled out of the kernel OOM killer's early picks (#588).
# Since #568, `--accept-dns` points /etc/resolv.conf at MagicDNS, so every lookup,
# the DB host's included, goes through tailscaled. At the default 0 it was the
# kernel's third pick (after the exedev `systemd --user` and `(sd-pam)`), freeing
# ~52 MiB and taking production's DNS with it. -950 ranks it below the API
# (power-map.service, -900), which depends on it. Not -1000: that exempts it outright.
# Install: /etc/systemd/system/tailscaled.service.d/ + daemon-reload + restart
# tailscaled (docs/COMMANDS.md); OOMScoreAdjust= applies at process start.
[Service]
OOMScoreAdjust=-950
