[project]
name = "power-map"
version = "0.38.0"
description = "Web service for mapping political and corporate power: people, organizations, roles, and their temporal relationships."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "nameparser>=1.1.3",
    "phonenumbers>=9.0.26",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.0.0",
    "python-multipart>=0.0.22",
    "python-ulid>=3.1.0",
    "typing-extensions>=4.15.0",
    "usaddress>=0.5.10",
    "uvicorn>=0.34.0",
    "validators>=0.34.0",
]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "lxml>=6.1.1",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "shellcheck-py>=0.11.0.1",
]
seed = [
    "langcodes[data]>=3.5",
    "pycountry>=24.0",
]
browser = [
    "playwright>=1.49",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration and not browser'"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that hit live external services; excluded by default (run with -m integration)",
    "browser: marks Playwright real-browser tests (axe sweeps + flow smoke; #300/#367/#368); excluded by default, never pre-commit (run with -m browser after `uv sync --group browser && playwright install chromium`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["skills-vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
